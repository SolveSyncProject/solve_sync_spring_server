spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret

  datasource:
    url: jdbc:h2:mem:solvesync;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

external:
  collector:
    enabled: false

solvesync:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-32-bytes
    issuer: solvesync-test
    access-token-expires-minutes: 120

  security:
    oauth2:
      authorized-redirect-uris:
        - http://localhost:3000

  evaluation:
    enabled: false

  maintenance:
    platform-account:
      enabled: false

  mq:
    daily-summary:
      exchange: test.solve.exchange
      queue: test.solve.daily-summary.queue
      routing-key: test.solve.daily-summary.upsert

  solve:
    http:
      max-batch-size: 5000
